# Production: everything that varies comes from environment variables. No default secret.
spring:
  datasource:
    url: ${CSS_DB_URL}
    username: ${CSS_DB_USER}
    password: ${CSS_DB_PASSWORD}

app:
  downstream:
    base-url: ${CSS_DOWNSTREAM_URL}
    timeout: ${CSS_DOWNSTREAM_TIMEOUT:2s}
  jwt:
    secret: ${CSS_JWT_SECRET}   # no default: prod does not start without it
